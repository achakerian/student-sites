name: Update site manifest

on:
  push:
    branches: [main]
    paths:
      - 'students/**'
      - 'scripts/build-manifest.mjs'
      - '!students/sites.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/build-manifest.test.mjs
      - run: node scripts/build-manifest.mjs students
      - name: Commit manifest if changed
        run: |
          if git diff --quiet -- students/sites.json; then
            echo "Manifest unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add students/sites.json
          git commit -m "Update site manifest [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
